[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-embeddings"
version = "0.1.0"
description = "Research infrastructure for ontology-aware multi-label learning"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "owlready2>=0.46,<1",
  "pandas>=2,<4",
  "Pillow>=10,<13",
  "scikit-learn>=1.3,<2",
  "torch>=2.2,<3",
]

[project.scripts]
oe-dataset = "ontology_embeddings.cli:main"
oe-town = "ontology_embeddings.town_experiment:main"
oe-rel01 = "ontology_embeddings.rel01_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ontology_embeddings*"]

[tool.setuptools.package-data]
ontology_embeddings = ["dataset/assets/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
